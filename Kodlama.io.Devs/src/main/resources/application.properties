# Gizli bilgiler bu dosyada tutulmaz; ortam degiskenlerinden okunur.
# Yerel gelistirme icin bu klasordeki .env dosyasi (varsa) otomatik yuklenir.
spring.config.import=optional:file:.env[.properties]

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.show-sql=true
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/homeworkDb}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.properties.javax.persistence.validation.mode = none
